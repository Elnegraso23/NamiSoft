name: Instalador Windows

# Manual (workflow_dispatch) o al publicar un tag v*. No se ejecuta en cada push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version del instalador (ej. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publicar self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish NamiSoft.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
          if (-not (Test-Path "publish/win-x64/NamiSoft.exe")) { throw "No se genero NamiSoft.exe" }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "No se encontro ISCC.exe" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compilar instalador
        shell: pwsh
        run: |
          $version = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          Write-Host "Version: $version"
          & $env:ISCC "/DMyAppVersion=$version" "instalador\NamiSoft.iss"
          if (-not (Test-Path "publish/instalador/NamiSoft-Setup-$version-x64.exe")) { throw "El instalador no se genero" }
          Get-ChildItem publish/instalador | Format-Table Name, Length
          Get-FileHash "publish/instalador/NamiSoft-Setup-$version-x64.exe" -Algorithm SHA256 | Format-List

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NamiSoft-Setup
          path: publish/instalador/*.exe
          if-no-files-found: error

      - name: Adjuntar a la Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/instalador/*.exe
