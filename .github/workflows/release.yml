name: Release NamiSoft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la versión (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: NamiSoft-linux-x64.tar.gz
          - os: windows-latest
            rid: win-x64
            archive: NamiSoft-win-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NamiSoft.csproj

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish NamiSoft.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.rid }}

      - name: Package Linux
        if: matrix.rid == 'linux-x64'
        run: tar -czf ${{ matrix.archive }} -C publish/linux-x64 .

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath ${{ matrix.archive }} -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: NamiSoft ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
