name: Prueba instalacion sin firma (Windows)

# Verifica en un Windows real que instalador/instalar-namisoft.ps1 deja la app
# instalada y que arranca como DLL bajo dotnet.exe (la ruta que evita el
# WinError 4551 de Smart App Control).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "instalador/instalar-namisoft.ps1"
      - ".github/workflows/prueba-fdd.yml"
      - "NamiSoft.csproj"

permissions:
  contents: read

jobs:
  prueba:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar con el script (sin BD, sin accesos directos)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File instalador/instalar-namisoft.ps1 -FromSource -NoDb -NoShortcut -InstallDir "$env:RUNNER_TEMP\NamiSoft"
          if ($LASTEXITCODE -ne 0) { throw "El instalador termino con codigo $LASTEXITCODE" }

      - name: Comprobar artefactos
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "NamiSoft"
          $dll = Join-Path $dir "app\NamiSoft.dll"
          $cmd = Join-Path $dir "NamiSoft.cmd"
          if (-not (Test-Path $dll)) { throw "Falta NamiSoft.dll" }
          if (-not (Test-Path $cmd)) { throw "Falta el lanzador NamiSoft.cmd" }
          if (-not (Test-Path (Join-Path $dir "app\Configurar-BD.ps1"))) { throw "Falta Configurar-BD.ps1" }
          Write-Host ("archivos instalados: " + (Get-ChildItem (Join-Path $dir "app") -Recurse -File).Count)
          Write-Host ("dll: " + (Get-Item $dll).Length + " bytes")
          Get-Content $cmd

      - name: Arrancar como DLL bajo dotnet (10 s)
        continue-on-error: true
        shell: pwsh
        run: |
          $dir  = Join-Path $env:RUNNER_TEMP "NamiSoft"
          $dll  = Join-Path $dir "app\NamiSoft.dll"
          $out  = Join-Path $env:RUNNER_TEMP "app.out"
          $err  = Join-Path $env:RUNNER_TEMP "app.err"
          $p = Start-Process -FilePath "dotnet" -ArgumentList "`"$dll`"" -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Minimized
          Start-Sleep -Seconds 10
          $vivo = -not $p.HasExited
          Write-Host ("proceso dotnet vivo tras 10 s: " + $vivo)
          if ($vivo) {
            Write-Host "OK: la DLL corre bajo el host firmado (no se ejecuto ningun apphost sin firma)."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host ("codigo de salida: " + $p.ExitCode)
          }
          foreach ($f in @($out, $err)) {
            if ((Test-Path $f) -and (Get-Item $f).Length -gt 0) {
              Write-Host ("--- " + $f + " ---")
              Get-Content $f -Tail 40
            }
          }
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match "NET Runtime|Application Error|Avalonia" } |
            Select-Object -First 2 | Format-List TimeCreated, ProviderName, Message

      - name: Diagnostico (runtimes y versiones)
        if: always()
        shell: pwsh
        run: |
          dotnet --list-runtimes
          dotnet --list-sdks
